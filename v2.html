<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goethe Grammatik Master V2</title>
    <style>
        :root {
            --goethe-blue: #005aa3; /* Der (Masculine) */
            --goethe-red: #e3001b;  /* Die (Feminine) */
            --goethe-green: #008939; /* Das (Neuter) */
            --bg-color: #f0f2f5;
            --text-color: #333;
            --card-bg: white;
            --accent: #ffcc00; /* Goethe Yellow-ish for highlights */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: #222;
            color: white;
            width: 100%;
            padding: 1rem 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; }
        
        .nav-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(1px); }

        .btn-mode { background-color: #444; color: #ccc; }
        .btn-mode.active { background-color: white; color: #222; box-shadow: 0 2px 8px rgba(255,255,255,0.3); }

        .btn-review {
            background-color: var(--goethe-red);
            color: white;
            display: none; /* Hidden unless mistakes exist */
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(227, 0, 27, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(227, 0, 27, 0); }
            100% { box-shadow: 0 0 0 0 rgba(227, 0, 27, 0); }
        }

        /* CONTAINER */
        #game-container {
            flex: 1;
            width: 100%;
            max-width: 700px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mode-section {
            width: 100%;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .mode-section.active-view { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- SCOREBOARD --- */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: bold;
            color: #555;
            box-sizing: border-box;
        }

        /* --- CARDS & INTERFACE --- */
        .card-display {
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .main-text {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .sub-text {
            color: #888;
            font-size: 1rem;
            font-style: italic;
        }

        /* --- GENDER CONTROLS --- */
        .grid-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .control-btn {
            padding: 25px 10px;
            color: white;
            font-size: 1.1rem;
            border-radius: 12px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-der { background-color: var(--goethe-blue); }
        .btn-das { background-color: var(--goethe-green); }
        .btn-die { background-color: var(--goethe-red); }

        .key-hint {
            display: block;
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- SENTENCE BUILDER --- */
        .drop-zone {
            min-height: 80px;
            background: #e9e9e9;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 15px;
            border: 2px dashed #ccc;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .word-piece {
            background-color: white;
            border: 1px solid #ddd;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            user-select: none;
            box-shadow: 0 3px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .word-piece:hover { transform: translateY(-2px); box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .word-piece.used { opacity: 0; pointer-events: none; }
        
        .word-piece.correct-pos { background-color: #333; color: white; border-color: #333; }
        .word-piece.wrong-anim { animation: shake 0.4s; background-color: var(--goethe-red); color: white; }

        /* --- CASE ATTACK (NEW) --- */
        .gap-sentence {
            font-size: 1.8rem;
            line-height: 1.5;
        }
        .gap-highlight {
            display: inline-block;
            min-width: 100px;
            border-bottom: 3px solid #333;
            text-align: center;
            color: var(--goethe-blue);
        }
        .case-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .case-btn {
            background: white;
            color: #333;
            border: 2px solid #ddd;
            padding: 20px;
            font-size: 1.2rem;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .case-btn:hover { background: #f9f9f9; border-color: #bbb; }

        /* FEEDBACK CLASSES */
        .feedback-correct { background-color: var(--goethe-green) !important; color: white !important; }
        .feedback-wrong { background-color: var(--goethe-red) !important; color: white !important; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

<header>
    <h1>GOETHE TRAINER <span style="font-size:0.8rem; opacity:0.7; font-weight:normal;">v2.0</span></h1>
    <div class="nav-buttons">
        <button id="nav-gender" class="btn-mode active" onclick="app.setMode('gender')">Gender Dash</button>
        <button id="nav-sentence" class="btn-mode" onclick="app.setMode('sentence')">Sentence Builder</button>
        <button id="nav-case" class="btn-mode" onclick="app.setMode('case')">Case Attack</button>
        <button id="nav-review" class="btn-review" onclick="app.startReview()">Review Mistakes (<span id="mistake-count">0</span>)</button>
    </div>
</header>

<div id="game-container">

    <div id="view-gender" class="mode-section active-view">
        <div class="stats-bar">
            <span>Score: <span id="gender-score">0</span></span>
            <span>Streak: <span id="gender-streak">0</span></span>
        </div>
        
        <div class="card-display" id="gender-card">
            <div class="main-text" id="gender-word">...</div>
            <div class="sub-text" id="gender-translation">Translation</div>
        </div>

        <div class="grid-controls">
            <button class="control-btn btn-der" onclick="app.checkGender('der')">DER<span class="key-hint">← Left</span></button>
            <button class="control-btn btn-das" onclick="app.checkGender('das')">DAS<span class="key-hint">↓ Down</span></button>
            <button class="control-btn btn-die" onclick="app.checkGender('die')">DIE<span class="key-hint">→ Right</span></button>
        </div>
    </div>

    <div id="view-sentence" class="mode-section">
        <div class="stats-bar">
            <span>Solved: <span id="sent-score">0</span></span>
        </div>
        
        <div style="text-align:center; margin-bottom:10px;">
            <p style="font-size:1.1rem; color:#555; font-style:italic;" id="sent-translation">...</p>
        </div>

        <div class="drop-zone" id="sent-dropzone">
            </div>

        <div class="word-bank" id="sent-bank">
            </div>
        
        <div style="text-align:center; margin-top:20px;">
            <button id="btn-next-sent" onclick="app.nextSentence()" style="background:#333; color:white; display:none;">Next Sentence ➝</button>
        </div>
    </div>

    <div id="view-case" class="mode-section">
        <div class="stats-bar">
            <span>Score: <span id="case-score">0</span></span>
        </div>

        <div class="card-display">
            <div class="gap-sentence" id="case-sentence">
                Ich sehe <span class="gap-highlight">___</span> Mann.
            </div>
            <div class="sub-text" style="margin-top:15px;">Choose the correct form (dieser/diese/dieses...)</div>
        </div>

        <div class="case-options" id="case-options">
            </div>
    </div>

</div>

<script>
/**
 * GOETHE TRAINER DATA ENGINE
 */
const Database = {
    nouns: [
        // A1/A2 Core
        { w: "Apfel", a: "der", t: "Apple" }, { w: "Buch", a: "das", t: "Book" }, { w: "Frau", a: "die", t: "Woman" },
        { w: "Mann", a: "der", t: "Man" }, { w: "Kind", a: "das", t: "Child" }, { w: "Tisch", a: "der", t: "Table" },
        { w: "Stuhl", a: "der", t: "Chair" }, { w: "Lampe", a: "die", t: "Lamp" }, { w: "Fenster", a: "das", t: "Window" },
        { w: "Tür", a: "die", t: "Door" }, { w: "Auto", a: "das", t: "Car" }, { w: "Bus", a: "der", t: "Bus" },
        { w: "Zug", a: "der", t: "Train" }, { w: "Bahnhof", a: "der", t: "Station" }, { w: "Fahrkarte", a: "die", t: "Ticket" },
        { w: "Flughafen", a: "der", t: "Airport" }, { w: "Reise", a: "die", t: "Trip" }, { w: "Urlaub", a: "der", t: "Vacation" },
        { w: "Sonne", a: "die", t: "Sun" }, { w: "Mond", a: "der", t: "Moon" }, { w: "Stern", a: "der", t: "Star" },
        { w: "Himmel", a: "der", t: "Sky" }, { w: "Wasser", a: "das", t: "Water" }, { w: "Feuer", a: "das", t: "Fire" },
        { w: "Luft", a: "die", t: "Air" }, { w: "Zeit", a: "die", t: "Time" }, { w: "Uhr", a: "die", t: "Clock" },
        { w: "Tag", a: "der", t: "Day" }, { w: "Nacht", a: "die", t: "Night" }, { w: "Woche", a: "die", t: "Week" },
        { w: "Monat", a: "der", t: "Month" }, { w: "Jahr", a: "das", t: "Year" }, { w: "Computer", a: "der", t: "Computer" },
        { w: "Handy", a: "das", t: "Mobile Phone" }, { w: "Rechnung", a: "die", t: "Bill" }, { w: "Adresse", a: "die", t: "Address" },
        { w: "Name", a: "der", t: "Name" }, { w: "Stadt", a: "die", t: "City" }, { w: "Land", a: "das", t: "Country" },
        { w: "Wohnung", a: "die", t: "Apartment" }, { w: "Zimmer", a: "das", t: "Room" }, { w: "Küche", a: "die", t: "Kitchen" },
        { w: "Bad", a: "das", t: "Bath" }, { w: "Bett", a: "das", t: "Bed" }, { w: "Schrank", a: "der", t: "Cupboard" },
        { w: "Schlüssel", a: "der", t: "Key" }, { w: "Tasche", a: "die", t: "Bag" }, { w: "Geld", a: "das", t: "Money" },
        { w: "Problem", a: "das", t: "Problem" }, { w: "Lösung", a: "die", t: "Solution" }, { w: "Frage", a: "die", t: "Question" },
        { w: "Antwort", a: "die", t: "Answer" }
    ],
    
    sentences: [
        { de: "Ich habe Hunger", en: "I am hungry" },
        { de: "Wir gehen ins Kino", en: "We are going to the cinema" },
        { de: "Das Wetter ist heute sehr schön", en: "The weather is very nice today" },
        { de: "Kannst du mir bitte helfen", en: "Can you please help me" },
        { de: "Er kauft ein neues Auto", en: "He is buying a new car" },
        { de: "Sie trinkt gerne Kaffee mit Milch", en: "She likes drinking coffee with milk" },
        { de: "Wo ist der nächste Supermarkt", en: "Where is the nearest supermarket" },
        { de: "Ich muss morgen früh aufstehen", en: "I have to get up early tomorrow" },
        { de: "Der Zug kommt pünktlich an", en: "The train arrives on time" },
        { de: "Hast du meine Schlüssel gesehen", en: "Have you seen my keys" },
        { de: "Ich verstehe diesen Satz nicht", en: "I do not understand this sentence" },
        { de: "Wir haben keine Zeit dafür", en: "We have no time for that" }
    ],

    // Focus on "Dieser/Diese/Diesem" logic
    cases: [
        // Nominative
        { s: "___ Mann ist mein Vater.", ans: "Dieser", opts: ["Dieser", "Diesen", "Diesem", "Dieses"], hint: "Nominativ (Subject)" },
        { s: "___ Frau kommt aus Berlin.", ans: "Diese", opts: ["Dieser", "Diese", "Diesem", "Diesen"], hint: "Nominativ (Subject)" },
        { s: "___ Kind spielt gerne.", ans: "Dieses", opts: ["Dieser", "Diese", "Dieses", "Diesen"], hint: "Nominativ (Subject)" },
        
        // Accusative (Movement / Direct Object)
        { s: "Ich sehe ___ Mann.", ans: "diesen", opts: ["dieser", "diesen", "diesem", "dieses"], hint: "Akkusativ (Direct Object)" },
        { s: "Er kauft ___ Tisch.", ans: "diesen", opts: ["diesen", "diesem", "dieser", "dieses"], hint: "Akkusativ (Direct Object)" },
        { s: "Wir essen ___ Apfel.", ans: "diesen", opts: ["diese", "diesen", "diesem", "dieses"], hint: "Akkusativ (Direct Object)" },
        { s: "Sie sucht ___ Tasche.", ans: "diese", opts: ["diesen", "diese", "diesem", "dieses"], hint: "Akkusativ (Fem remains Diese)" },
        
        // Dative (Location / Indirect Object)
        { s: "Ich helfe ___ Mann.", ans: "diesem", opts: ["diesen", "diesem", "dieser", "dieses"], hint: "Dativ (Helfen takes Dativ)" },
        { s: "Wir wohnen in ___ Haus.", ans: "diesem", opts: ["dieses", "diesen", "diesem", "dieser"], hint: "Dativ (In + Location)" },
        { s: "Das Auto gehört ___ Frau.", ans: "dieser", opts: ["diese", "dieser", "diesem", "diesen"], hint: "Dativ (Feminine changes to Der/Dieser)" },
        { s: "Er gibt ___ Kind den Ball.", ans: "diesem", opts: ["dieses", "diesen", "diesem", "dieser"], hint: "Dativ (Indirect Object)" }
    ]
};

/**
 * APP ENGINE
 */
const app = {
    state: {
        mode: 'gender',
        score: { gender: 0, sentence: 0, case: 0 },
        streak: 0,
        mistakes: [], // Stores objects { type: 'gender', item: ... }
        isReviewing: false,
        reviewQueue: [],
        
        // Current Items
        currWord: null,
        currSent: null,
        currSentBuilt: [],
        currCase: null
    },

    init: function() {
        this.loadMistakes();
        this.updateMistakeButton();
        this.setupKeyboard();
        this.nextGender();
    },

    // --- NAVIGATION ---
    setMode: function(mode) {
        this.state.mode = mode;
        this.state.isReviewing = false;
        
        // UI Updates
        document.querySelectorAll('.mode-section').forEach(el => el.classList.remove('active-view'));
        document.getElementById(`view-${mode}`).classList.add('active-view');
        
        document.querySelectorAll('.btn-mode').forEach(el => el.classList.remove('active'));
        document.getElementById(`nav-${mode}`).classList.add('active');

        // Init specific mode
        if(mode === 'gender') this.nextGender();
        if(mode === 'sentence') this.nextSentence();
        if(mode === 'case') this.nextCase();
    },

    startReview: function() {
        if(this.state.mistakes.length === 0) return;
        
        this.state.isReviewing = true;
        this.state.reviewQueue = [...this.state.mistakes]; // Copy
        alert(`Review Mode Started! You have ${this.state.reviewQueue.length} items to fix.`);
        
        // Determine first item type
        this.nextReviewItem();
    },

    nextReviewItem: function() {
        if(this.state.reviewQueue.length === 0) {
            alert("Review Complete! Great job.");
            this.state.isReviewing = false;
            this.state.mistakes = []; // Clear mistakes
            this.saveMistakes();
            this.updateMistakeButton();
            this.setMode('gender'); // Return to start
            return;
        }

        const item = this.state.reviewQueue[0]; // Peek
        if(item.type === 'gender') {
            this.setMode('gender');
            this.renderGender(item.data);
        } else if (item.type === 'case') {
            this.setMode('case');
            this.renderCase(item.data);
        }
        // Simplified: Sentences are not in mistake review yet (too complex for v2)
    },

    // --- MISTAKE MANAGEMENT ---
    addMistake: function(type, data) {
        // Prevent duplicates
        const exists = this.state.mistakes.some(m => JSON.stringify(m.data) === JSON.stringify(data));
        if(!exists) {
            this.state.mistakes.push({ type, data });
            this.saveMistakes();
            this.updateMistakeButton();
        }
    },

    saveMistakes: function() {
        localStorage.setItem('goetheMistakes', JSON.stringify(this.state.mistakes));
    },

    loadMistakes: function() {
        const saved = localStorage.getItem('goetheMistakes');
        if(saved) this.state.mistakes = JSON.parse(saved);
    },

    updateMistakeButton: function() {
        const count = this.state.mistakes.length;
        const btn = document.getElementById('nav-review');
        document.getElementById('mistake-count').innerText = count;
        btn.style.display = count > 0 ? 'inline-block' : 'none';
    },

    // --- MODE 1: GENDER ---
    nextGender: function() {
        if(this.state.isReviewing) return; // Handled by review logic
        const rnd = Math.floor(Math.random() * Database.nouns.length);
        this.renderGender(Database.nouns[rnd]);
    },

    renderGender: function(wordObj) {
        this.state.currWord = wordObj;
        const card = document.getElementById('gender-card');
        const txt = document.getElementById('gender-word');
        
        // Reset Visuals
        card.style.background = 'white';
        card.style.color = '#333';
        txt.innerText = wordObj.w;
        document.getElementById('gender-translation').innerText = wordObj.t;
    },

    checkGender: function(input) {
        if(!this.state.currWord) return;
        const correct = this.state.currWord.a;
        const card = document.getElementById('gender-card');

        if(input === correct) {
            // Correct
            if(input === 'der') card.classList.add('flash-blue'); // These classes need to be in CSS (added inline logic below)
            if(input === 'die') card.style.background = 'var(--goethe-red)';
            if(input === 'das') card.style.background = 'var(--goethe-green)';
            if(input === 'der') card.style.background = 'var(--goethe-blue)';
            card.style.color = 'white';
            
            this.state.score.gender++;
            this.state.streak++;
            document.getElementById('gender-score').innerText = this.state.score.gender;
            document.getElementById('gender-streak').innerText = this.state.streak;

            // If reviewing, remove from queue
            if(this.state.isReviewing) {
                this.state.reviewQueue.shift();
                setTimeout(() => this.nextReviewItem(), 600);
            } else {
                setTimeout(() => this.nextGender(), 400);
            }

        } else {
            // Wrong
            this.state.streak = 0;
            document.getElementById('gender-streak').innerText = 0;
            card.style.background = '#333';
            card.style.color = 'white';
            
            if(!this.state.isReviewing) this.addMistake('gender', this.state.currWord);
            
            setTimeout(() => {
                card.style.background = 'white';
                card.style.color = '#333';
            }, 600);
        }
    },

    // --- MODE 2: SENTENCE BUILDER ---
    nextSentence: function() {
        const rnd = Math.floor(Math.random() * Database.sentences.length);
        const sObj = Database.sentences[rnd];
        this.state.currSent = sObj;
        this.state.currSentBuilt = [];
        
        // Reset UI
        document.getElementById('btn-next-sent').style.display = 'none';
        document.getElementById('sent-dropzone').innerHTML = '';
        document.getElementById('sent-translation').innerText = `"${sObj.en}"`;
        
        const bank = document.getElementById('sent-bank');
        bank.innerHTML = '';
        
        // Split and Shuffle (Fisher-Yates with Check)
        let parts = sObj.de.split(" ");
        let shuffled = [...parts];
        
        // Ensure it's not already sorted
        if (parts.length > 1) {
            let limit = 0;
            while (JSON.stringify(shuffled) === JSON.stringify(parts) && limit < 10) {
                shuffled.sort(() => Math.random() - 0.5);
                limit++;
            }
        }

        shuffled.forEach(word => {
            const btn = document.createElement('div');
            btn.className = 'word-piece';
            btn.innerText = word;
            btn.onclick = (e) => this.clickWord(word, e.target);
            bank.appendChild(btn);
        });
    },

    clickWord: function(word, el) {
        const targetParts = this.state.currSent.de.split(" ");
        const nextIndex = this.state.currSentBuilt.length;
        const targetWord = targetParts[nextIndex];

        if(word === targetWord) {
            // Correct
            this.state.currSentBuilt.push(word);
            el.classList.add('used');
            
            // Create static block in dropzone
            const block = document.createElement('div');
            block.className = 'word-piece correct-pos';
            block.innerText = word;
            document.getElementById('sent-dropzone').appendChild(block);

            // Check Win
            if(this.state.currSentBuilt.length === targetParts.length) {
                this.state.score.sentence++;
                document.getElementById('sent-score').innerText = this.state.score.sentence;
                document.getElementById('btn-next-sent').style.display = 'inline-block';
            }
        } else {
            // Wrong
            el.classList.add('wrong-anim');
            setTimeout(() => el.classList.remove('wrong-anim'), 400);
        }
    },

    // --- MODE 3: CASE ATTACK ---
    nextCase: function() {
        if(this.state.isReviewing) return; // Handled by review
        const rnd = Math.floor(Math.random() * Database.cases.length);
        this.renderCase(Database.cases[rnd]);
    },

    renderCase: function(caseObj) {
        this.state.currCase = caseObj;
        document.getElementById('case-sentence').innerHTML = caseObj.s.replace('___', '<span class="gap-highlight">___</span>');
        
        const container = document.getElementById('case-options');
        container.innerHTML = '';
        
        // Randomize options
        let opts = [...caseObj.opts].sort(() => Math.random() - 0.5);
        
        opts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'case-btn';
            btn.innerText = opt;
            btn.onclick = () => this.checkCase(opt, btn);
            container.appendChild(btn);
        });
    },

    checkCase: function(selected, btnElement) {
        const correct = this.state.currCase.ans; // e.g. "diesen"
        // Normalize for checking (ignore case sensitivity if needed, but German is strict)
        if(selected.toLowerCase() === correct.toLowerCase()) {
            btnElement.classList.add('feedback-correct');
            this.state.score.case++;
            document.getElementById('case-score').innerText = this.state.score.case;
            
            // Fill the gap visually
            document.querySelector('.gap-highlight').innerText = selected;
            document.querySelector('.gap-highlight').style.color = 'var(--goethe-green)';

            if(this.state.isReviewing) {
                this.state.reviewQueue.shift();
                setTimeout(() => this.nextReviewItem(), 1000);
            } else {
                setTimeout(() => this.nextCase(), 1000);
            }
        } else {
            btnElement.classList.add('feedback-wrong');
            if(!this.state.isReviewing) this.addMistake('case', this.state.currCase);
            setTimeout(() => btnElement.classList.remove('feedback-wrong'), 500);
        }
    },

    setupKeyboard: function() {
        document.addEventListener('keydown', (e) => {
            if(this.state.mode === 'gender') {
                if(e.key === "ArrowLeft") this.checkGender('der');
                if(e.key === "ArrowDown") this.checkGender('das');
                if(e.key === "ArrowRight") this.checkGender('die');
            }
        });
    }
};

// Start
window.onload = () => app.init();

</script>
</body>
